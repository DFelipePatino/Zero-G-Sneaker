<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroStep Pro | Zero-G Sneaker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="stars-container" id="stars"></div>
    
    <nav>
        <div class="logo">AEROSTEP<span>PRO</span></div>
        <div class="nav-links">
            <a href="#">Technology</a>
            <a href="#">Design</a>
            <a href="#">Community</a>
        </div>
        <div class="nav-cta">
            <button class="btn-glass secondary">Log In</button>
        </div>
    </nav>

    <main class="hero">
        <div class="hero-content">
            <h1 class="glitch" data-text="WALK ON AIR">WALK ON AIR</h1>
            <p class="subtitle">Experience zero-gravity comfort with the AeroStep Pro. Engineered for the futuristic urban explorer.</p>
            <div class="cta-group">
                <button class="btn-glass primary">BUY NOW</button>
                <div class="price">$249.00</div>
            </div>
        </div>

        <div class="sneaker-wrapper" id="parallax-container">
            <div class="sneaker-image-container" id="sneaker-move">
                <img src="sneaker.png" alt="AeroStep Pro Sneaker" class="sneaker-img">
                
                <!-- Stat Bubbles -->
                <div class="stat-bubble bubble-1">
                    <span class="label">Weight</span>
                    <span class="value">200g</span>
                </div>
                <div class="stat-bubble bubble-2">
                    <span class="label">Tech</span>
                    <span class="value">Air-Cushion</span>
                </div>
                <div class="stat-bubble bubble-3">
                    <span class="label">Grip</span>
                    <span class="value">Zero-Slip</span>
                </div>
            </div>
            <div class="glow-effect"></div>
        </div>
    </main>

    <div class="scroll-indicator">
        <div class="mouse">
            <div class="wheel"></div>
        </div>
        <span>Explore Depth</span>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
